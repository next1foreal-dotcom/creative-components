<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clawd-perch · minimal example</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1f1e1d;font:15px system-ui,sans-serif;color:#eee}
  .composer{width:min(640px,92vw)}
  clawd-perch{width:100%}
  textarea{box-sizing:border-box;width:100%;height:84px;resize:none;border-radius:16px;border:1px solid #3a3836;background:#2a2927;color:#eee;padding:14px 16px;font:inherit}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button{border:1px solid #444;background:#2f2d2b;color:#eee;border-radius:8px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="composer">
  <!-- Clawd sits on the top edge of whatever is right below it -->
  <clawd-perch id="clawd" lang="en"></clawd-perch>
  <textarea id="ta" placeholder="Reply to Claude… (Enter to send, Esc to stop)"></textarea>
  <div class="row">
    <button data-a="tool">tool()</button>
    <button data-a="ask">ask()</button>
    <button data-a="stream">stream()</button>
    <button data-a="error">error()</button>
    <button data-a="done">done()</button>
    <button data-a="fat">context(0.96)</button>
    <button data-a="compact">compact()</button>
    <button data-a="paste">paste(2000)</button>
  </div>
</div>
<script src="./clawd-perch.js"></script>
<script>
  const c = document.getElementById('clawd'), ta = document.getElementById('ta');
  const tools = ['Read', 'Edit', 'Bash', 'Grep'];
  ta.addEventListener('input', () => c.typing(ta.value.length));
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); c.send(ta.value); ta.value = ''; }
    if (e.key === 'Escape') c.stop();
  });
  ta.addEventListener('paste', e => c.paste(e.clipboardData.getData('text').length));
  document.querySelector('.row').addEventListener('click', async e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'tool') c.tool(tools[Math.floor(Math.random() * tools.length)]);
    else if (a === 'ask') { c.ask(); setTimeout(() => c.decide(confirm('Allow this tool call?')), 600); }
    else if (a === 'fat') c.context(0.96);
    else if (a === 'paste') c.paste(2000);
    else c[a]();
  });
</script>
</body>
</html>
