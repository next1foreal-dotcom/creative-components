<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chanting Monk — plain HTML</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EDECE9;font-family:system-ui,sans-serif}.box{width:min(560px,calc(100vw - 24px));display:grid;gap:12px}button{justify-self:start}</style>
</head><body><div class="box">
<chanting-monk id="m" lang="en" sound="true" max-height="220"></chanting-monk>
<button onclick="document.getElementById('m').play('short')">Short answer</button>
<button onclick="document.getElementById('m').play('ramble')">Ramble</button>
</div>
<script src="chanting-monk.js"></script>
<script>
  // Real use: hand it an async iterable of tokens
  // m.stream = (async function* () { for await (const chunk of yourLLMStream) yield chunk; })();
  document.getElementById('m').addEventListener('stop', (e) => console.log('stopped at', e.detail.text.length, 'chars'));
</script>
</body></html>
