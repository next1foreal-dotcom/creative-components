<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosy Password — demo</title>
<style>
html,body{margin:0;height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#EDECE9;color:#1F1F1F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
.wrap{width:min(420px,calc(100vw - 24px));padding:24px 0}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:26px;padding:28px 24px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -24px rgba(0,0,0,.18)}
h1{margin:0;font-size:22px;letter-spacing:-.01em}.sub{margin:4px 0 18px;color:#7a756f;font-size:14px}
.lab{display:block;margin:0 0 6px 3px;font-size:13px;font-weight:600;color:#57534d}
.plain{display:block;width:100%;box-sizing:border-box;height:46px;padding:0 14px;border:1.5px solid #d8d3cc;border-radius:14px;font:500 15px/1 inherit;color:#1f1f1f;outline:none}
.plain:focus{border-color:#8b7a5a;box-shadow:0 0 0 4px rgba(201,154,59,.18)}
.go{display:block;width:100%;height:46px;margin-top:18px;border:0;border-radius:14px;background:#1F1F1F;color:#fff;font:600 15px/1 inherit;cursor:pointer}
.msg{min-height:18px;margin-top:10px;font-size:12px;color:#7a756f;text-align:center}
.tips{margin:14px 0 0;font-size:12px;color:#7A756F;text-align:center}
.auto{border:0;background:#fff;border-radius:999px;padding:3px 10px;font:inherit;color:inherit;cursor:pointer;margin-left:4px}
.hero{display:grid;place-items:center;min-height:100vh;width:100vw}
.hero-stage{width:min(640px,calc(100vw - 40px));padding:40px 50px 54px;box-sizing:border-box;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:28px;box-shadow:0 18px 40px -24px rgba(0,0,0,.18)}
.hero-stage .np{margin:0 auto}
.pick{display:flex;gap:6px;margin:-6px 0 16px}.pick button{border:1px solid #e3dfd8;background:#faf9f7;border-radius:999px;padding:5px 12px;font:600 13px/1 inherit;color:#57534d;cursor:pointer}.pick button.on{background:#1F1F1F;border-color:#1F1F1F;color:#fff}
/* NosyPassword — a nosy little animal + password field */
.np{--aw:118px;--fh:46px;--fs:15px;--r:14px;position:relative;box-sizing:border-box;width:100%;max-width:380px;padding-top:calc(var(--aw) * 88 / 140);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.np-lg{--aw:190px;--fh:62px;--fs:19px;--r:19px;max-width:520px}
.np *{box-sizing:border-box}
.np-label{position:absolute;left:3px;top:calc(var(--aw) * 88 / 140 - 1.9em);font-size:13px;font-weight:600;color:#57534d;letter-spacing:.01em}
.np-lg .np-label{font-size:16px}
.np-art{position:absolute;z-index:2;top:0;left:50%;width:var(--aw);height:calc(var(--aw) * 100 / 140);transform:translateX(-50%);overflow:visible;pointer-events:none}
.np-field{position:relative}
.np-input{display:block;width:100%;height:var(--fh);margin:0;padding:0 calc(var(--fh) + 2px) 0 calc(var(--fh) * .32);border:1.5px solid #d8d3cc;border-radius:var(--r);background:#fff;color:#1f1f1f;font:500 var(--fs)/1 inherit;letter-spacing:.02em;outline:none;box-shadow:0 1px 0 rgba(0,0,0,.03),inset 0 1px 2px rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.np-input::placeholder{color:#a8a39b;letter-spacing:0}
.np-input:focus{border-color:#8b7a5a;box-shadow:0 0 0 4px rgba(201,154,59,.18),inset 0 1px 2px rgba(0,0,0,.04)}
.np-input::-ms-reveal{display:none}
.np-toggle{position:absolute;top:50%;right:calc(var(--fh) * .14);width:calc(var(--fh) * .72);height:calc(var(--fh) * .72);transform:translateY(-50%);display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#77716a;font-size:calc(var(--fs) * 1.25);cursor:pointer;transition:background .15s,color .15s}
.np-toggle:hover{background:#f2efea;color:#3a3630}
.np-toggle:focus-visible{outline:2px solid #c99a3b;outline-offset:1px}
.np-toggle[aria-pressed="true"]{color:#b0412f}
.is-disabled{opacity:.55}.is-disabled .np-toggle{cursor:default}

/* ---- art: shared ---- */
.np-art g{transform-box:view-box}
.np-turn{transform-origin:70px 94px;transition:transform .32s cubic-bezier(.3,1.35,.5,1)}
.np-head{transform-origin:70px 94px;transform:translateY(calc(var(--lean) * -5px)) rotate(calc(var(--hx) * 9deg)) scale(calc(1 + var(--lean) * .04));transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.np-iris{transform:translate(calc(var(--px) * .62),calc(var(--py) * .55));transition:transform .13s ease-out}
.np-eyeopen{transform-box:fill-box!important;transform-origin:center;transition:transform .16s ease,opacity .1s}
.np-eyesleep,.np-eyehappy{fill:none;stroke:#3a2a24;stroke-width:2.4;stroke-linecap:round;opacity:0;transition:opacity .1s}
.np-ear,.np-tick{transition:transform .32s cubic-bezier(.3,1.4,.5,1)}
.np-mouth,.np-sweat,.np-notes,.np-z{opacity:0;transition:opacity .15s}
.np-blush{opacity:1;transition:opacity .2s}
.np-mouth.smile{opacity:1}
.np-paw{transition:transform .3s cubic-bezier(.3,1.45,.5,1)}
.np-notes text,.np-z text{font:700 17px/1 -apple-system,"Segoe UI Symbol","Noto Sans Symbols",sans-serif}
.np-z text{font-size:11px}

/* brows */
.np-brow{transform-box:fill-box!important;transform-origin:center;transition:transform .2s}
.is-gasp .np-brow{transform:translateY(-3px)}
.is-sad .np-brow.l,.is-cover .np-brow.l{transform:rotate(14deg) translateY(1px)}.is-sad .np-brow.r,.is-cover .np-brow.r{transform:rotate(-14deg) translateY(1px)}
.is-asleep .np-brows{opacity:.6}
.np-bell{transform-box:view-box;transform-origin:70px 86px}
.np-a-teddy.has-ticked.is-focus:not(.is-revealed) .np-bell{animation:npBell .5s ease-out}
@keyframes npBell{25%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}}
/* awake: blink now and then */
.np:not(.is-asleep).is-idle .np-eyeopen,.np.is-startle .np-eyeopen{animation:npBlink 4.6s infinite}

/* asleep */
.is-asleep .np-head{transform:translateY(9px);animation:npBreathe 3.2s ease-in-out infinite}
.is-asleep .np-eyeopen{opacity:0}.is-asleep .np-eyesleep{opacity:1}
.is-asleep .np-z{opacity:1}
.is-asleep .np-z .z1{animation:npZ 3.2s ease-in-out infinite}
.is-asleep .np-z .z2{animation:npZ 3.2s ease-in-out 1.6s infinite}

/* startle on focus */
.is-startle .np-head{animation:npStartle .42s cubic-bezier(.3,1.5,.5,1)}

/* gasp */
.is-gasp .np-eyeopen{transform:scale(1.16)}
.is-gasp .np-head{transform:translateY(-4px) scale(1.03)}
.is-gasp .np-mouth.smile{opacity:0}.is-gasp .np-mouth.gasp{opacity:1}
.is-gasp .np-paw{transform:translateY(-3px)}
.is-gasp .np-sweat{opacity:1}

/* hiding (cover / peek / caught) shared */
.is-cover .np-mouth.smile,.is-peek .np-mouth.smile,.is-caught .np-mouth.smile{opacity:0}
.is-cover .np-mouth.flat,.is-peek .np-mouth.flat,.is-caught .np-mouth.gasp{opacity:1}
.is-cover .np-blush,.is-peek .np-blush,.is-caught .np-blush{opacity:.95}
.is-cover .np-sweat{opacity:1;animation:npDrip 1.6s ease-in infinite}
.is-caught .np-sweat{opacity:1}

/* whistle */
.is-whistle .np-mouth.smile{opacity:0}.is-whistle .np-mouth.oo{opacity:1}
.is-whistle .np-eyeopen{opacity:0}.is-whistle .np-eyehappy{opacity:1}
.is-whistle .np-head{animation:npSway 1.6s ease-in-out}
.is-whistle .np-notes{opacity:1}
.is-whistle .np-notes .n1{animation:npNote 1.5s ease-out both}
.is-whistle .np-notes .n2{animation:npNote 1.5s ease-out .35s both}

/* sad */
.is-sad .np-head{transform:translateY(15px);transition-duration:.6s;transition-timing-function:ease}
.is-sad .np-mouth.smile{opacity:0}.is-sad .np-mouth.flat{opacity:1}
.is-sad .np-paw{transform:translateY(2px)}

/* ---- teddy: ears flip over the eyes ---- */
.np-a-teddy.is-cover .np-turn,.np-a-teddy.is-peek .np-turn,.np-a-teddy.is-caught .np-turn{transform:rotate(-7deg) translate(-3px,0)}
.np-a-teddy.is-cover .np-ear.l,.np-a-teddy.is-caught .np-ear.l{transform:rotate(-60deg)}
.np-a-teddy.is-cover .np-ear.r,.np-a-teddy.is-caught .np-ear.r,.np-a-teddy.is-peek .np-ear.r{transform:rotate(60deg)}
.np-a-teddy.is-peek .np-ear.l{transform:rotate(-24deg);transition-duration:.45s;transition-timing-function:ease-in-out}
.np-a-teddy.is-cover .np-eyeopen,.np-a-teddy.is-caught .np-eyeopen,.np-a-teddy.is-peek .np-eye.r .np-eyeopen{opacity:0}
.np-a-teddy.is-caught .np-ear{transition-duration:.09s}
.np-a-teddy.is-caught .np-turn{animation:npShake .36s ease-in-out}
.np-a-teddy.is-sad .np-ear.l{transform:rotate(8deg)}.np-a-teddy.is-sad .np-ear.r{transform:rotate(-8deg)}
.np-a-teddy.has-ticked.is-focus:not(.is-revealed) .np-tick.l{animation:npSwingL .5s ease-out}
.np-a-teddy.has-ticked.is-focus:not(.is-revealed) .np-tick.r{animation:npSwingR .5s ease-out}
.np-bow{transform-box:fill-box!important;transform-origin:center}
.np-a-teddy.is-startle .np-bow,.np-a-teddy.is-gasp .np-bow{animation:npBoing .4s}

/* ---- corgi: turns round and shows its butt ---- */
.np-front,.np-back{transform-origin:70px 90px;transition:transform .14s ease-in}
.np-back{transform:scaleX(0)}
.np-a-corgi.is-cover .np-front,.np-a-corgi.is-peek .np-front,.np-a-corgi.is-caught .np-front{transform:scaleX(0)}
.np-a-corgi.is-cover .np-back,.np-a-corgi.is-peek .np-back,.np-a-corgi.is-caught .np-back{transform:scaleX(1);transition:transform .2s cubic-bezier(.3,1.5,.5,1) .14s}
.np-a-corgi.is-cover .np-buttwrap{animation:npWiggle .9s ease-in-out .35s infinite}
.np-buttwrap{transform-origin:70px 90px}
.np-nub{transform-origin:70px 58px;animation:npNub .35s ease-in-out infinite alternate}
.np-peekhead{transform:translate(-20px,34px);transition:transform .4s ease-in-out}
.np-a-corgi.is-peek .np-peekhead{transform:translate(25px,-10px) rotate(10deg)}
.np-a-corgi.is-caught .np-peekhead{transition-duration:.08s}
.np-a-corgi.is-caught .np-buttwrap{animation:npShake2 .36s ease-in-out}
.np-a-corgi.is-sad .np-ear.l{transform:rotate(-34deg)}.np-a-corgi.is-sad .np-ear.r{transform:rotate(34deg)}
.np-a-corgi.is-asleep .np-ear.l{transform:rotate(-48deg)}.np-a-corgi.is-asleep .np-ear.r{transform:rotate(48deg)}
.np-a-corgi.has-ticked.is-focus:not(.is-revealed) .np-tick.l{animation:npPerkL .4s ease-out}
.np-a-corgi.has-ticked.is-focus:not(.is-revealed) .np-tick.r{animation:npPerkR .4s ease-out}
.np-a-corgi.is-startle .np-ear.l{animation:npPerkL .42s}.np-a-corgi.is-startle .np-ear.r{animation:npPerkR .42s}

@keyframes npBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes npBreathe{0%,100%{transform:translateY(9px)}50%{transform:translateY(10.5px) scale(1.012)}}
@keyframes npZ{0%{opacity:0;transform:translate(0,4px)}25%{opacity:1}100%{opacity:0;transform:translate(5px,-10px)}}
@keyframes npStartle{0%{transform:translateY(9px)}35%{transform:translateY(-7px) scale(1.05)}100%{transform:none}}
@keyframes npDrip{0%{transform:translateY(0)}70%{transform:translateY(5px)}100%{transform:translateY(5px);opacity:0}}
@keyframes npShake{0%,100%{transform:rotate(-7deg) translate(-3px,0)}25%{transform:rotate(-11deg) translate(-5px,0)}55%{transform:rotate(-4deg) translate(-1px,0)}80%{transform:rotate(-9deg) translate(-4px,0)}}
@keyframes npShake2{0%,100%{transform:none}25%{transform:translateX(-3px)}55%{transform:translateX(3px)}80%{transform:translateX(-2px)}}
@keyframes npSway{0%,100%{transform:none}30%{transform:rotate(3deg)}65%{transform:rotate(-2.5deg)}}
@keyframes npNote{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-26px) rotate(14deg)}}
@keyframes npSwingL{25%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}}
@keyframes npSwingR{25%{transform:rotate(-14deg)}60%{transform:rotate(8deg)}}
@keyframes npPerkL{30%{transform:rotate(-12deg) scale(1.06)}}
@keyframes npPerkR{30%{transform:rotate(12deg) scale(1.06)}}
@keyframes npBoing{30%{transform:scale(1.3) rotate(-10deg)}60%{transform:scale(.9) rotate(6deg)}}
@keyframes npWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes npNub{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}

@media (prefers-reduced-motion:reduce){
  .np *,.np-art g{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

.is-asleep .np-mouth.smile{opacity:0}.is-asleep .np-mouth.flat{opacity:1}

/* ---- bear: paws up over the eyes ---- */
.np-a-bear .np-paw{transform-box:view-box}
.np-a-bear.is-cover .np-paw.l,.np-a-bear.is-caught .np-paw.l,.np-a-bear.is-peek .np-paw.l{transform:translate(9px,-33px) rotate(-12deg) scale(1.38)}
.np-a-bear.is-cover .np-paw.r,.np-a-bear.is-caught .np-paw.r{transform:translate(-9px,-33px) rotate(12deg) scale(1.38)}
.np-a-bear.is-peek .np-paw.r{transform:translate(6px,-10px) rotate(32deg) scale(1.15);transition-duration:.45s}
.np-a-bear.is-caught .np-paw{transition-duration:.09s}
.np-a-bear .np-paw.l{transform-origin:46px 88px}.np-a-bear .np-paw.r{transform-origin:94px 88px}
.np-a-bear .np-eyesleep,.np-a-bear .np-eyehappy{stroke:#141010;stroke-width:2.4}
.np-a-bear .np-paw ellipse:first-child{stroke:#141010;stroke-width:2.4}
