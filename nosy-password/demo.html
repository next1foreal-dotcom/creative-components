<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosy Password — demo</title>
<style>
html,body{margin:0;height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#EDECE9;color:#1F1F1F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
.wrap{width:min(420px,calc(100vw - 24px));padding:24px 0}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:26px;padding:28px 24px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -24px rgba(0,0,0,.18)}
h1{margin:0;font-size:22px;letter-spacing:-.01em}.sub{margin:4px 0 18px;color:#7a756f;font-size:14px}
.lab{display:block;margin:0 0 6px 3px;font-size:13px;font-weight:600;color:#57534d}
.plain{display:block;width:100%;box-sizing:border-box;height:46px;padding:0 14px;border:1.5px solid #d8d3cc;border-radius:14px;font:500 15px/1 inherit;color:#1f1f1f;outline:none}
.plain:focus{border-color:#8b7a5a;box-shadow:0 0 0 4px rgba(201,154,59,.18)}
.go{display:block;width:100%;height:46px;margin-top:18px;border:0;border-radius:14px;background:#1F1F1F;color:#fff;font:600 15px/1 inherit;cursor:pointer}
.msg{min-height:18px;margin-top:10px;font-size:12px;color:#7a756f;text-align:center}
.tips{margin:14px 0 0;font-size:12px;color:#7A756F;text-align:center}
.auto{border:0;background:#fff;border-radius:999px;padding:3px 10px;font:inherit;color:inherit;cursor:pointer;margin-left:4px}
.hero{display:grid;place-items:center;min-height:100vh;width:100vw}
.hero-stage{width:min(640px,calc(100vw - 40px));padding:40px 50px 54px;box-sizing:border-box;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:28px;box-shadow:0 18px 40px -24px rgba(0,0,0,.18)}
.hero-stage .np{margin:0 auto}
/* NosyPassword — raccoon neighbour + password field */
.np{--aw:104px;--fh:46px;--fs:15px;--r:14px;position:relative;box-sizing:border-box;width:100%;max-width:380px;padding-top:calc(var(--aw) * 88 / 140);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.np-lg{--aw:168px;--fh:62px;--fs:19px;--r:19px;max-width:520px}
.np *{box-sizing:border-box}
.np-label{position:absolute;left:3px;top:calc(var(--aw) * 88 / 140 - 1.9em);font-size:13px;font-weight:600;color:#57534d;letter-spacing:.01em}
.np-lg .np-label{font-size:16px}
.np-art{position:absolute;z-index:2;top:0;left:50%;width:var(--aw);height:calc(var(--aw) * 96 / 140);transform:translateX(-50%);overflow:visible;pointer-events:none}
.np-field{position:relative}
.np-input{display:block;width:100%;height:var(--fh);margin:0;padding:0 calc(var(--fh) + 2px) 0 calc(var(--fh) * .32);border:1.5px solid #d8d3cc;border-radius:var(--r);background:#fff;color:#1f1f1f;font:500 var(--fs)/1 inherit;letter-spacing:.02em;outline:none;box-shadow:0 1px 0 rgba(0,0,0,.03),inset 0 1px 2px rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.np-input::placeholder{color:#a8a39b;letter-spacing:0}
.np-input:focus{border-color:#8b7a5a;box-shadow:0 0 0 4px rgba(201,154,59,.18),inset 0 1px 2px rgba(0,0,0,.04)}
.np-input::-ms-reveal{display:none}
.np-toggle{position:absolute;top:50%;right:calc(var(--fh) * .14);width:calc(var(--fh) * .72);height:calc(var(--fh) * .72);transform:translateY(-50%);display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#77716a;font-size:calc(var(--fs) * 1.25);cursor:pointer;transition:background .15s,color .15s}
.np-toggle:hover{background:#f2efea;color:#3a3630}
.np-toggle:focus-visible{outline:2px solid #c99a3b;outline-offset:1px}
.np-toggle[aria-pressed="true"]{color:#b0412f}
.is-disabled{opacity:.55}.is-disabled .np-toggle{cursor:default}

/* ---- art: shared transform setup ---- */
.np-art g{transform-box:view-box}
.np-turn{transform-origin:70px 94px;transition:transform .32s cubic-bezier(.3,1.35,.5,1)}
.np-head{transform-origin:70px 94px;transform:translateY(calc(var(--lean) * -5px)) scale(calc(1 + var(--lean) * .045));transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.np-pupil{transform-box:fill-box!important;transform-origin:center;transform:translate(var(--px),var(--py));transition:transform .13s ease-out}
.np-lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .22s ease}
.np-glasses,.np-ear{transition:transform .2s}
.np-ear.l{transform-origin:40px 40px}.np-ear.r{transform-origin:100px 40px}
.np-glint{stroke:#fff;stroke-width:1.8;stroke-linecap:round;opacity:0}
.is-focus .np-glint{animation:npGlint .45s ease-out}
.np-mouth,.np-blush,.np-sweat,.np-notes,.np-z{opacity:0;transition:opacity .15s}
.np-mouth.smile{opacity:1}
.np-paw,.np-arm{transition:transform .3s cubic-bezier(.3,1.45,.5,1)}
.np-pawshape{transform-box:fill-box!important;transform-origin:center;transition:transform .3s cubic-bezier(.3,1.45,.5,1)}
.np-notes text,.np-z text{font:700 17px/1 -apple-system,"Segoe UI Symbol","Noto Sans Symbols",sans-serif}
.np-z text{font-size:11px}

/* awake idle: blink now and then */
.np:not(.is-asleep).is-idle .np-lid,.np.is-startle .np-lid{animation:npBlink 4.6s infinite}

/* asleep: lids half down, head sunk, breathing, z's */
.is-asleep .np-head{transform:translateY(8px);animation:npBreathe 3.2s ease-in-out infinite}
.is-asleep .np-lid{transform:scaleY(.6)}
.is-asleep .np-z{opacity:1}
.is-asleep .np-z .z1{animation:npZ 3.2s ease-in-out infinite}
.is-asleep .np-z .z2{animation:npZ 3.2s ease-in-out 1.6s infinite}

/* startle on focus */
.is-startle .np-head{animation:npStartle .42s cubic-bezier(.3,1.5,.5,1)}
.is-startle .np-ear.l{animation:npEarL .42s}.is-startle .np-ear.r{animation:npEarR .42s}
.is-startle .np-glasses{animation:npJiggle .42s}

/* gasp: eyes wide, little hop, sweat */
.is-gasp .np-pupil{transform:translate(var(--px),var(--py)) scale(.62)}
.is-gasp .np-head{transform:translateY(-4px) scale(1.03)}
.is-gasp .np-turn{transform:rotate(-4deg) translateX(-2px)}
.is-gasp .np-mouth.smile{opacity:0}.is-gasp .np-mouth.gasp{opacity:1}
.is-gasp .np-paw{transform:translateY(-3px)}
.is-gasp .np-sweat{opacity:1}

/* cover: head whipped away, both paws over the glasses, blushing */
.is-cover .np-turn,.is-peek .np-turn,.is-caught .np-turn{transform:rotate(-13deg) translate(-7px,1px)}
.is-cover .np-head,.is-peek .np-head,.is-caught .np-head{transform:translateY(-2px)}
.is-cover .np-paw.l,.is-cover .np-arm.l,.is-peek .np-paw.l,.is-peek .np-arm.l,.is-caught .np-paw.l,.is-caught .np-arm.l{transform:translate(8px,-32px)}
.is-cover .np-paw.r,.is-cover .np-arm.r,.is-caught .np-paw.r,.is-caught .np-arm.r{transform:translate(-8px,-32px)}
.is-cover .np-pawshape,.is-peek .np-paw.l .np-pawshape,.is-caught .np-pawshape{transform:scale(1.42,1.55)}
.is-cover .np-mouth.smile,.is-peek .np-mouth.smile,.is-caught .np-mouth.smile{opacity:0}
.is-cover .np-mouth.flat,.is-peek .np-mouth.flat,.is-caught .np-mouth.gasp{opacity:1}
.is-cover .np-blush,.is-peek .np-blush,.is-caught .np-blush{opacity:.85}
.is-cover .np-sweat{opacity:1;animation:npDrip 1.6s ease-in infinite}
.is-cover .np-lid,.is-caught .np-lid{transform:scaleY(1)}
/* peek: right paw slides down, one eye sneaks a look */
.is-peek .np-paw.r,.is-peek .np-arm.r{transform:translate(-3px,-19px);transition-duration:.45s;transition-timing-function:ease-in-out}
.is-peek .np-paw.r .np-pawshape{transform:scale(1.3)}
.is-peek .np-eye.l .np-lid{transform:scaleY(1)}
.is-peek .np-eye.r .np-lid{transform:scaleY(.18)}
/* caught: snaps shut, head shake */
.is-caught .np-paw,.is-caught .np-arm{transition-duration:.09s;transition-timing-function:ease-out}
.is-caught .np-turn{animation:npShake .36s ease-in-out}
.is-caught .np-sweat{opacity:1}

/* whistle: innocent look up, little o, notes */
.is-whistle .np-mouth.smile{opacity:0}.is-whistle .np-mouth.oo{opacity:1}
.is-whistle .np-lid{transform:scaleY(.32)}
.is-whistle .np-head{animation:npSway 1.6s ease-in-out}
.is-whistle .np-notes{opacity:1}
.is-whistle .np-notes .n1{animation:npNote 1.5s ease-out both}
.is-whistle .np-notes .n2{animation:npNote 1.5s ease-out .35s both}

/* sad: cleared it all, sinks halfway */
.is-sad .np-head{transform:translateY(15px);transition-duration:.6s;transition-timing-function:ease}
.is-sad .np-lid{transform:scaleY(.48)}
.is-sad .np-mouth.smile{opacity:0}.is-sad .np-mouth.flat{opacity:1}
.is-sad .np-paw{transform:translateY(2px)}

@keyframes npBlink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes npBreathe{0%,100%{transform:translateY(8px)}50%{transform:translateY(9.5px) scale(1.012)}}
@keyframes npZ{0%{opacity:0;transform:translate(0,4px)}25%{opacity:1}100%{opacity:0;transform:translate(5px,-10px)}}
@keyframes npStartle{0%{transform:translateY(8px)}35%{transform:translateY(-7px) scale(1.05)}100%{transform:none}}
@keyframes npEarL{30%{transform:rotate(-14deg)}}@keyframes npEarR{30%{transform:rotate(14deg)}}
@keyframes npJiggle{30%{transform:translateY(-3px) rotate(-3deg)}60%{transform:translateY(1px) rotate(2deg)}}
@keyframes npGlint{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes npDrip{0%{transform:translateY(0)}70%{transform:translateY(5px)}100%{transform:translateY(5px);opacity:0}}
@keyframes npShake{0%,100%{transform:rotate(-13deg) translate(-7px,1px)}25%{transform:rotate(-17deg) translate(-9px,1px)}55%{transform:rotate(-10deg) translate(-5px,1px)}80%{transform:rotate(-15deg) translate(-8px,1px)}}
@keyframes npSway{0%,100%{transform:none}30%{transform:rotate(3deg)}65%{transform:rotate(-2.5deg)}}
@keyframes npNote{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-26px) rotate(14deg)}}

@media (prefers-reduced-motion:reduce){
  .np *,.np-art g{animation:none!important;transition-duration:.01ms!important}
}
