<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Dialog Agent Input — demo</title>
<style>
html,body{margin:0;height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;color:#1F1F1F;
  background:#EDECE9}
.demo{width:min(560px,calc(100vw - 24px));min-height:100vh;min-height:100dvh;padding:20px 0 24px;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box}
.panel{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:24px;padding:22px 18px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -24px rgba(0,0,0,.18)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.bubble{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.35}
.bubble.me{align-self:flex-end;background:#1F1F1F;color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:#F2F1EF;color:#1F1F1F;border-bottom-left-radius:6px}
.demo-tips{margin:14px 0 0;font-size:12px;color:#7A756F;text-align:center}
.demo-sound{border:0;background:#F2F1EF;border-radius:999px;padding:2px 8px;font:inherit;color:inherit;cursor:pointer}
.hero{display:grid;place-items:center;min-height:100vh;width:100vw}
.hero-stage{width:min(760px,calc(100vw - 40px));padding:70px 40px 40px;box-sizing:border-box;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:28px;box-shadow:0 18px 40px -24px rgba(0,0,0,.18)}

.pd {
  --px: 2px; --cpx: 3px; --pxs: 1.3px; --fs: 21px; --lh: 22px; --label: 8px;
  --ink: #ffffff; --edge: #ffffff; --dark: #1b1030;
  --bg1: #3550e6; --bg2: #121a86; --plate: #1b1030;
  position: relative; display: block; width: 100%; box-sizing: border-box;
  padding: calc(var(--px)*6) calc(var(--px)*6) calc(var(--px)*6);
  font-family: 'PD VT323', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  -webkit-font-smoothing: none; -webkit-tap-highlight-color: transparent;
}
.pd-lg { --px: 3px; --cpx: 4px; --pxs: 2px; --fs: 32px; --lh: 32px; --label: 12px; }
.pd svg { display: block; width: calc(var(--px)*var(--sw)); height: calc(var(--px)*var(--sh)); image-rendering: pixelated; overflow: visible; }
.pd *, .pd *::before, .pd *::after { box-sizing: border-box; }

/* ---- the box */
.pd-frame {
  position: relative; display: flex; align-items: center; gap: calc(var(--px)*5);
  min-height: calc(var(--px)*26); padding: calc(var(--px)*4) calc(var(--px)*5) calc(var(--px)*4) calc(var(--px)*5);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 calc(var(--px)*1), transparent calc(var(--px)*1) calc(var(--px)*2)),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  box-shadow:
    0 calc(var(--px)*-2) 0 0 var(--edge), 0 calc(var(--px)*2) 0 0 var(--edge), calc(var(--px)*-2) 0 0 0 var(--edge), calc(var(--px)*2) 0 0 0 var(--edge),
    0 calc(var(--px)*-4) 0 0 var(--dark), 0 calc(var(--px)*4) 0 0 var(--dark), calc(var(--px)*-4) 0 0 0 var(--dark), calc(var(--px)*4) 0 0 0 var(--dark),
    calc(var(--px)*-2) calc(var(--px)*-2) 0 0 var(--dark), calc(var(--px)*2) calc(var(--px)*-2) 0 0 var(--dark), calc(var(--px)*-2) calc(var(--px)*2) 0 0 var(--dark), calc(var(--px)*2) calc(var(--px)*2) 0 0 var(--dark),
    0 calc(var(--px)*8) 0 0 rgba(27,16,48,.22), calc(var(--px)*2) calc(var(--px)*6) 0 0 rgba(27,16,48,.22), calc(var(--px)*-2) calc(var(--px)*6) 0 0 rgba(27,16,48,.22);
  transition: background .25s;
}
.pd-shaking { animation: pd-shake .3s steps(6) 1; }
@keyframes pd-shake { 0%,100% { transform: none } 20% { transform: translate(calc(var(--px)*-2), calc(var(--px)*1)) } 40% { transform: translate(calc(var(--px)*2), 0) } 60% { transform: translate(calc(var(--px)*-1), calc(var(--px)*-1)) } 80% { transform: translate(calc(var(--px)*1), 0) } }

.pd-plate {
  position: absolute; left: calc(var(--px)*8); top: calc(var(--px)*-9); z-index: 2;
  padding: calc(var(--px)*2) calc(var(--px)*3) calc(var(--px)*1); background: var(--plate); color: #ffd23f;
  font: var(--label)/1 'PD Press Start', monospace; letter-spacing: 0;
  box-shadow: 0 calc(var(--px)*-1) 0 0 var(--edge), 0 calc(var(--px)*1) 0 0 var(--edge), calc(var(--px)*-1) 0 0 0 var(--edge), calc(var(--px)*1) 0 0 0 var(--edge);
}
.pd-rivet { position: absolute; width: calc(var(--px)*2); height: calc(var(--px)*2); background: #ffd23f; box-shadow: calc(var(--px)*1) calc(var(--px)*1) 0 0 #b07d10; }
.pd-r1 { left: calc(var(--px)*1); top: calc(var(--px)*1); } .pd-r2 { right: calc(var(--px)*2); top: calc(var(--px)*1); } .pd-r3 { left: calc(var(--px)*1); bottom: calc(var(--px)*2); } .pd-r4 { right: calc(var(--px)*2); bottom: calc(var(--px)*2); }

/* ---- portrait */
.pd-portrait {
  position: relative; flex: none; align-self: flex-start; margin-top: calc(var(--px)*1);
  padding: calc(var(--px)*1); background: #0b0f4d;
  box-shadow: 0 calc(var(--px)*-1) 0 0 #8fa0ff, 0 calc(var(--px)*1) 0 0 #8fa0ff, calc(var(--px)*-1) 0 0 0 #8fa0ff, calc(var(--px)*1) 0 0 0 #8fa0ff;
}
.pd-gold .pd-portrait { background: #5a3a00; }
.pd-glint { position: absolute; left: calc(var(--px)*6); top: calc(var(--px)*12); width: calc(var(--px)*1); height: calc(var(--px)*1); background: #fff; animation: pd-glint 1.4s steps(1) infinite; }
@keyframes pd-glint { 0%,70% { opacity: 1 } 71%,100% { opacity: 0 } }
.pd-aura { position: absolute; inset: calc(var(--px)*-3); box-shadow: 0 0 0 calc(var(--px)*1) #ffd23f; animation: pd-aura .26s steps(4) forwards; }
.pd-aura2 { animation-delay: .1s; box-shadow: 0 0 0 calc(var(--px)*1) #ff8a1f; opacity: 0; }
@keyframes pd-aura { 0% { opacity: 1; inset: calc(var(--px)*-1) } 100% { opacity: 0; inset: calc(var(--px)*-6) } }
.pd-charging .pd-mage { animation: pd-jit .26s steps(6); }
@keyframes pd-jit { 0%,100% { transform: none } 33% { transform: translate(calc(var(--px)*1), 0) } 66% { transform: translate(calc(var(--px)*-1), 0) } }

/* ---- text field */
.pd-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--px)*2); }
.pd-field { position: relative; height: calc(var(--lh) * var(--rows, 1)); }
.pd-cue { position: absolute; left: 0; top: 0; line-height: var(--lh); font-size: calc(var(--fs) * .78); color: #ffd23f; width: calc(var(--fs) * .75); }
.pd-focus .pd-cue { animation: pd-cue .8s steps(1) infinite; }
@keyframes pd-cue { 50% { opacity: 0 } }
.pd-input, .pd-mirror, .pd-cast-text, .pd-shatter {
  position: absolute; inset: 0; margin: 0; padding: 0 0 0 calc(var(--fs) * .85);
  font: var(--fs)/var(--lh) 'PD VT323', ui-monospace, monospace; letter-spacing: .02em;

}
.pd-input {

}

/* ---- attachments (inventory) */

  display: inline-flex; align-items: center; gap: calc(var(--px)*2); padding: calc(var(--px)*1) calc(var(--px)*2) calc(var(--px)*1) calc(var(--px)*1); background: rgba(10,8,50,.55); color: var(--ink);

}

  font: var(--label)/1 'PD Press Start', monospace; color: #fff; text-shadow: calc(var(--px)*.5) calc(var(--px)*.5) 0 rgba(0,0,0,.45); pointer-events: none;
}

.pd-chestbtn { filter: drop-shadow(0 calc(var(--px)*1) 0 #1b1030); }

/* ---- fireball send */

}

.pd-beam {

  background: linear-gradient(180deg, #ff4d4d 0 16.6%, #ff9a1f 16.6% 33.3%, #ffe14d 33.3% 50%, #4fdc6a 50% 66.6%, #3fb0ff 66.6% 83.3%, #a26bff 83.3%);

}

  position: absolute; left: calc(var(--px)*-2); top: calc(var(--px)*-2); width: calc(var(--px)*4); height: calc(var(--px)*4); background: #ffd23f;

@keyframes pd-spark { 0% { transform: rotate(var(--a)) translateX(0) scale(1.4) } 100% { transform: rotate(var(--a)) translateX(calc(calc(var(--px)*14) * var(--d))) scale(.3); opacity: 0 } }

@keyframes pd-hit { 0%,16%,50% { opacity: 1; color: #fff } 17%,33%,66%,100% { opacity: 0 } 34%,49% { opacity: 1; color: #ff4d4d } 67%,83% { opacity: 1; color: #ff4d4d } }

}

/* ================= v2: spells, moods, rarity ================= */
/* spell tag on the top border: what this message will cast + its token cost */
.pd-tag {
  position: absolute; right: calc(var(--px)*8); top: calc(var(--px)*-9); z-index: 2; display: inline-flex; align-items: center; gap: calc(var(--px)*3);
  padding: calc(var(--px)*2) calc(var(--px)*3) calc(var(--px)*1); background: var(--plate); color: #ff8a1f;
  font: var(--label)/1 'PD Press Start', monospace;
  box-shadow: 0 calc(var(--px)*-1) 0 0 var(--edge), 0 calc(var(--px)*1) 0 0 var(--edge), calc(var(--px)*-1) 0 0 0 var(--edge), calc(var(--px)*1) 0 0 0 var(--edge);
  animation: pd-tagin .18s steps(3);
}
.pd-tag b { font-weight: 400; color: #fff; opacity: .85; }

/* charge orb on the mage's staff tip: grows with the spell tier */
.pd-orb { position: absolute; right: calc(var(--px)*-3); top: calc(var(--px)*-3); z-index: 2; animation: pd-orbin .2s steps(3), pd-orbfl .24s steps(2) .2s infinite; filter: drop-shadow(0 0 calc(var(--px)*2) rgba(255,160,40,.9)); }

/* moods: the mage reads what you write */

@keyframes pd-hop { 50% { transform: translateY(calc(var(--px)*-1)) } }
.pd-hearts { position: absolute; left: calc(var(--px)*3); top: calc(var(--px)*-12); width: calc(var(--px)*14); height: 0; z-index: 3; pointer-events: none; }
.pd-hearts svg { position: absolute; bottom: 0; opacity: 0; animation: pd-heart 1.5s steps(10) infinite; }

.pd-smoke { position: absolute; right: calc(var(--px)*-8); top: calc(var(--px)*2); z-index: 3; pointer-events: none; }

/* classic RPG lines that type themselves out */
.pd-toast {
  position: absolute; left: calc(var(--fs) * .85); top: 0; line-height: var(--lh); font-size: var(--fs); color: #ffffff;
  white-space: nowrap; overflow: hidden; max-width: calc(100% - var(--fs)); pointer-events: none;

/* spell tiers */
.pd-t0 { --sweep: 340ms; }

  position: absolute; left: 50%; top: calc(var(--px)*-27); z-index: 5; white-space: nowrap; pointer-events: none;

@keyframes pd-callin { 0% { transform: translateX(-50%) scale(2.2); opacity: 0 } 100% { transform: translateX(-50%) scale(1) } }
.pd-dmg {
  position: absolute; right: calc(var(--px)*4); top: 0; z-index: 5; white-space: nowrap; pointer-events: none; text-align: center;
  font: calc(var(--label) * 1.7)/1 'PD Press Start', monospace; color: #ffe14d;
  text-shadow: calc(var(--px)*1) calc(var(--px)*1) 0 #1b1030, calc(var(--px)*-1) calc(var(--px)*-1) 0 #1b1030, calc(var(--px)*1) calc(var(--px)*-1) 0 #1b1030, calc(var(--px)*-1) calc(var(--px)*1) 0 #1b1030;
  animation: pd-dmg .95s steps(12) forwards;
}
.pd-dmg em { display: block; font-style: normal; font-size: .6em; color: #ff4d4d; margin-bottom: calc(var(--px)*2); }
.pd-t2 .pd-dmg { right: auto; left: 50%; font-size: calc(var(--label) * 2.4); animation-name: pd-dmgc; }
@keyframes pd-dmg { 0% { transform: translateY(calc(var(--px)*4)) scale(1.6); opacity: 0 } 15% { transform: translateY(calc(var(--px)*-4)) scale(1); opacity: 1 } 75% { opacity: 1 } 100% { transform: translateY(calc(var(--px)*-14)); opacity: 0 } }
@keyframes pd-dmgc { 0% { transform: translate(-50%, calc(var(--px)*4)) scale(2); opacity: 0 } 15% { transform: translate(-50%, calc(var(--px)*-6)) scale(1); opacity: 1 } 75% { opacity: 1 } 100% { transform: translate(-50%, calc(var(--px)*-16)); opacity: 0 } }

/* FIRAGA: the sky goes dark, a meteor falls into the box */
.pd-frame:has(.pd-t2.pd-st-charge), .pd-frame:has(.pd-t2.pd-st-fly) { --bg1: #2a0d52; --bg2: #07021a; }
.pd-frame:has(.pd-t2.pd-st-charge) .pd-mirror, .pd-frame:has(.pd-t2.pd-st-fly) .pd-cast-text { text-shadow: 0 0 calc(var(--px)*3) rgba(255,120,60,.8); }
.pd-t2.pd-st-charge .pd-sw { animation: pd-quake .12s steps(2) infinite; }
@keyframes pd-quake { 50% { transform: translateY(calc(var(--px)*-.5)) } }
.pd-t2.pd-st-fly .pd-sw { animation: pd-quake .08s steps(2) infinite; }
.pd-t2.pd-st-boom .pd-cast-text { opacity: 1; clip-path: inset(calc(var(--px)*-14) -400px calc(var(--px)*-3) -400px); }
.pd-t2.pd-st-boom .pd-sw { opacity: 1; animation: pd-blast .6s cubic-bezier(.2,.7,.4,1) forwards; }
@keyframes pd-blast {
  0% { transform: none; color: #fff }
  20% { color: #ffe14d }
  100% { transform: translate(calc(var(--r) * calc(var(--px)*6)), calc(calc(var(--px)*-6) - var(--u) * calc(var(--px)*2))) rotate(calc(var(--r) * 40deg)) scale(.5); opacity: 0; color: #ff4d4d }
}
.pd-meteor { --px: calc(var(--cpx) * 1.35); position: absolute; left: 46%; top: 50%; width: 0; height: 0; z-index: 4; opacity: 0; }
.pd-st-fly .pd-meteor { opacity: 1; animation: pd-fall .43s cubic-bezier(.6,0,1,.6) forwards; }
.pd-st-charge .pd-meteor { opacity: 1; transform: translate(calc(var(--px)*34), calc(var(--px)*-34)) scale(.4); animation: pd-glimmer .2s steps(2) infinite; }
@keyframes pd-glimmer { 50% { opacity: .4 } }
@keyframes pd-fall { 0% { transform: translate(calc(var(--px)*34), calc(var(--px)*-34)) scale(.4) } 100% { transform: translate(0, 0) scale(1) } }
.pd-rock { position: absolute; left: calc(var(--px)*-8); top: calc(var(--px)*-7); filter: drop-shadow(0 0 calc(var(--px)*2) #ff8a1f) drop-shadow(0 0 calc(var(--px)*4) rgba(255,77,77,.8)); }
.pd-st-fly .pd-rock { animation: pd-spin .43s steps(4) forwards; }
@keyframes pd-spin { to { transform: rotate(-90deg) } }
.pd-trail {
  position: absolute; left: 0; top: calc(var(--px)*-3); width: calc(var(--px)*34); height: calc(var(--px)*12); margin-top: calc(var(--px)*-3); transform-origin: 0 50%; transform: rotate(-45deg);
  background: linear-gradient(90deg, #ffe14d, #ff8a1f 30%, rgba(232,50,43,.7) 60%, rgba(232,50,43,0));
  clip-path: polygon(0 0, 100% 40%, 100% 60%, 0 100%);
}
.pd-meteor-fire { display: none; }
.pd-shock { position: absolute; left: 46%; top: 50%; width: 0; height: 0; z-index: 4; border-radius: 0; box-shadow: 0 0 0 calc(var(--px)*2) #fff6c9; animation: pd-ring .5s steps(6) forwards; }
@keyframes pd-ring { 0% { box-shadow: 0 0 0 calc(var(--px)*2) #fff6c9; transform: scale(1); } 100% { box-shadow: 0 0 0 calc(var(--px)*2) rgba(255,138,31,0); width: calc(var(--px)*120); height: calc(var(--px)*40); margin: calc(var(--px)*-20) 0 0 calc(var(--px)*-60); } }
.pd-flash { position: absolute; inset: calc(var(--px)*-6) calc(var(--px)*-60) calc(var(--px)*-6) calc(var(--px)*-30); z-index: 4; background: #fff6c9; animation: pd-flash .18s steps(3) forwards; pointer-events: none; }
@keyframes pd-flash { 0% { opacity: .32 } 100% { opacity: 0 } }
.pd-st-boom.pd-t2 .pd-boom { left: 46%; right: auto; }
.pd-t2 .pd-boom i { width: calc(var(--px)*5); height: calc(var(--px)*5); }

/* attachment rarity */
.pd-item.pd-rar-rare { box-shadow: 0 0 0 calc(var(--px)*1) #59d8ff; }
.pd-item.pd-rar-epic { box-shadow: 0 0 0 calc(var(--px)*1) #c77dff; }
.pd-item.pd-rar-legendary { box-shadow: 0 0 0 calc(var(--px)*1) #ffd23f, 0 0 calc(var(--px)*3) rgba(255,210,63,.8); }
.pd-pillar { position: absolute; left: 50%; bottom: calc(var(--px)*5); width: calc(var(--px)*8); margin-left: calc(var(--px)*-4); height: 0; opacity: 0;
  background: linear-gradient(0deg, var(--beam), rgba(255,255,255,0)); }
.pd-c-open .pd-pillar { opacity: 1; animation: pd-pillar .35s steps(5) forwards; }
@keyframes pd-pillar { to { height: calc(var(--px)*46); } }
.pd-rar-legendary.pd-c-open .pd-pillar { width: calc(var(--px)*12); margin-left: calc(var(--px)*-6); }
.pd-got { color: var(--rc, #ffd23f); }
.pd-rar-common .pd-got { color: #ffd23f; }

@media (prefers-reduced-motion: reduce) {
  .pd *, .pd *::before, .pd *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ================= v3: voice ================= */
.pd-micbtn { position: relative; border: 0; padding: 0; background: none; cursor: pointer; line-height: 0; filter: drop-shadow(0 calc(var(--px)*1) 0 #1b1030); }
.pd-micbtn:focus-visible { outline: calc(var(--px)*1) dashed #ffd23f; outline-offset: calc(var(--px)*1); }
.pd-micbtn:disabled { cursor: default; opacity: .5; }
.pd-micbtn:hover .pd-micicon { transform: translateY(calc(var(--px)*-1)); }
.pd-rec .pd-micicon { animation: pd-recbob .36s steps(2) infinite; }
.pd-rec::after { content: ''; position: absolute; right: calc(var(--px)*-2); top: calc(var(--px)*-2); width: calc(var(--px)*3); height: calc(var(--px)*3); background: #ff4d4d; box-shadow: 0 0 0 calc(var(--px)*1) #1b1030; animation: pd-recdot .8s steps(1) infinite; }
@keyframes pd-recbob { 50% { transform: translateY(calc(var(--px)*-1)); } }
@keyframes pd-recdot { 50% { opacity: 0; } }

.pd-tag-listen { color: #59d8ff; background: #12324a; }
.pd-vu { display: inline-flex; align-items: flex-end; gap: calc(var(--px)*1); height: var(--label); }
.pd-vu i { width: calc(var(--px)*2); background: rgba(89,216,255,.25); }
.pd-vu i:nth-child(1) { height: 30%; } .pd-vu i:nth-child(2) { height: 50%; } .pd-vu i:nth-child(3) { height: 70%; }
.pd-vu i:nth-child(4) { height: 85%; } .pd-vu i:nth-child(5) { height: 100%; }
.pd-vu i.on { background: #59d8ff; }
.pd-vu i.on:nth-child(5) { background: #ffd23f; }

.pd-listening .pd-portrait { box-shadow: inset 0 0 0 calc(var(--px)*1) #59d8ff; }
.pd-listening .pd-mage { animation: pd-lean .9s steps(2) infinite; }
@keyframes pd-lean { 50% { transform: translateX(calc(var(--px)*1)); } }

.pd-horn { position: absolute; left: calc(var(--px)*14); top: calc(var(--px)*9); z-index: 2; animation: pd-hornin .18s steps(3); }
@keyframes pd-hornin { 0% { transform: translateX(calc(var(--px)*-4)); opacity: 0; } }
.pd-listening .pd-cue { visibility: hidden; }
/* notes ride along the top border, from the LISTEN tag into the mage's name plate; bob height follows volume */
.pd-notes { position: absolute; left: calc(var(--px)*30); right: calc(var(--px)*64); top: calc(var(--px)*-11); height: calc(var(--px)*12); pointer-events: none; z-index: 3; }
.pd-note { position: absolute; right: 0; bottom: calc(var(--y) * var(--px) * .35); animation: pd-note 1.1s steps(14) forwards; }
@keyframes pd-note {
  0% { right: 0; transform: scale(.6); opacity: 0; }
  12% { opacity: 1; transform: translateY(calc(var(--px)*-2)) scale(1); }
  35% { transform: translateY(calc(var(--px)*1)); }
  60% { transform: translateY(calc(var(--px)*-2)); }
  85% { opacity: 1; }
  100% { right: 100%; transform: translateY(calc(var(--px)*1)) scale(.7); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .pd-note, .pd-rec .pd-micicon, .pd-listening .pd-mage { animation: none; } .pd-notes { display: none; } }
