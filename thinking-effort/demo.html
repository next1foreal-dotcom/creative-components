<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Effort Glass — demo</title>
<style>
html,body{margin:0;height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(60% 50% at 18% 12%, rgba(255,214,226,.95), rgba(255,214,226,0) 70%),
    radial-gradient(55% 45% at 85% 20%, rgba(255,222,180,.9), rgba(255,222,180,0) 70%),
    radial-gradient(70% 60% at 70% 95%, rgba(140,160,235,.95), rgba(140,160,235,0) 70%),
    radial-gradient(60% 50% at 10% 90%, rgba(196,170,230,.9), rgba(196,170,230,0) 70%),
    linear-gradient(160deg,#f6d4dc,#d9c2e6 55%,#a9b6ea);
  background-attachment:fixed}
.demo{width:min(440px,calc(100vw - 32px));padding:32px 0;display:flex;flex-direction:column;align-items:center}
.demo-log{margin:18px 0 0;font-size:13px;font-weight:600;color:rgba(45,30,75,.72);text-align:center;min-height:18px}
.demo-tips{margin:6px 0 0;font-size:12px;color:rgba(45,30,75,.5);text-align:center}
/*demo-extra*/
.demo-sound{margin:16px 0 0;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px 0 10px;border:0;border-radius:99px;cursor:pointer;
  font:600 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Arial,sans-serif;color:rgba(45,30,75,.78);
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 0 0 .5px rgba(30,20,50,.1),0 4px 12px -6px rgba(40,20,60,.3),inset 0 1px 0 #fff;transition:background .2s,transform .2s}
.demo-sound:hover{background:rgba(255,255,255,.78)} .demo-sound:active{transform:scale(.95)}
.demo-sound.on{color:#2a3a1c;background:rgba(236,248,214,.85)}
.demo-sound svg{width:17px;height:17px;fill:currentColor;stroke:currentColor;stroke-width:0;stroke-linejoin:round}
.demo-sound svg .w{fill:none;stroke-width:1.7;stroke-linecap:round}
.demo-sound:focus-visible{outline:2px solid rgba(70,110,255,.6);outline-offset:2px}
.demo-credit{margin:10px 0 0;font-size:11px;color:rgba(45,30,75,.42);text-align:center}
/*demo-extra-end*/
/* EffortGlass — frosted-glass thinking-effort slider. Everything is scoped under .eg-root. */
.eg-root {
  --ink: #17161c;
  --ink2: #5f5b6c;
  --ink3: #9a96a8;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  /* written every frame by the spring loop (defaults = Medium) */
  --eg-sleep: 0; --eg-awake: 1; --eg-spark: 0; --eg-zap: 0; --eg-hot: 0; --eg-bb: 0; --eg-glow: 0; --eg-acc: .4; --eg-tint: .2;
  --eg-l0: 0; --eg-l1: 1; --eg-l2: 0; --eg-l3: 0; --eg-l4: 0; --eg-l5: 0;
  --eg-accent: 255, 122, 172; --eg-hint: 112, 88, 108;
  --eg-fear: 0; --eg-sweat: 0; --eg-scream: 0; --eg-flee: 0; --eg-sneak: 0; --eg-scare: 0;
  --eg-bub: 0; --eg-popk: 1; --eg-capk: 0; --eg-bite: 0;
  width: 100%;
  max-width: 440px;
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", "PingFang SC", Arial, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
.eg-root *, .eg-root *::before, .eg-root *::after { box-sizing: border-box; }
.eg-root button { font-family: inherit; }

/* ---------- card ---------- */
.eg-card {
  position: relative;
  padding: 22px 22px 16px;
  border-radius: 30px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .66), rgba(255, 255, 255, .44));
  -webkit-backdrop-filter: blur(30px) saturate(1.7);
  backdrop-filter: blur(30px) saturate(1.7);
  box-shadow:
    inset 0 0 0 .5px rgba(255, 255, 255, .75),
    inset 0 1px 0 rgba(255, 255, 255, .95),
    0 0 0 .5px rgba(30, 20, 50, .06),
    0 10px 24px -14px rgba(40, 20, 60, .28),
    0 34px 70px -28px rgba(40, 20, 60, .42);
}
/* level accent: a tinted wash in the corner and a soft coloured halo, blended continuously */
.eg-card::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  background: radial-gradient(90% 70% at 0% 0%, rgba(var(--eg-accent), calc(var(--eg-acc) * .16)), rgba(var(--eg-accent), 0) 70%);
  box-shadow: inset 0 0 0 1px rgba(var(--eg-accent), calc(var(--eg-acc) * .22)), 0 18px 48px -22px rgba(var(--eg-accent), calc(var(--eg-acc) * .55));
}

/* ---------- header ---------- */
.eg-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eg-heading { min-width: 0; }
.eg-eyebrow {
  display: flex; align-items: center; gap: 6px; height: 20px;
  font-size: 13px; font-weight: 600; color: var(--ink2); letter-spacing: -.005em;
}
.eg-eyebrow svg { width: 13px; height: 13px; fill: rgb(var(--eg-accent)); opacity: .9; }
.eg-rec-chip {
  margin-left: 4px; padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 600; letter-spacing: .01em; color: #3d5bd9;
  background: rgba(80, 110, 240, .1); box-shadow: inset 0 0 0 .5px rgba(80, 110, 240, .22);
  opacity: 0; transform: translateX(-4px) scale(.94);
  transition: opacity .3s var(--ease-out), transform .45s var(--ease-out);
}
.eg-rec-chip.on { opacity: 1; transform: none; }

.eg-roll { position: relative; height: 40px; margin-top: 4px; overflow: hidden; }
.eg-roll-in { transition: transform .6s var(--ease-out); will-change: transform; }
.eg-roll-in span {
  display: block; width: max-content; height: 40px;
  font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -.03em; white-space: nowrap;
  opacity: 0; filter: blur(3px);
  transition: opacity .35s var(--ease-out), filter .45s var(--ease-out), color .4s;
}
.eg-roll-in span.on { opacity: 1; filter: none; }
.eg-roll-in span.eg-brainless { color: #c23c6e; }
/* each level name has its own treatment */
.eg-roll-in .eg-roll-0 { color: #4d5690; font-weight: 600; }
.eg-roll-in .eg-roll-1 { color: var(--ink); }
.eg-roll-in .eg-roll-2, .eg-roll-in .eg-roll-3, .eg-roll-in .eg-roll-4, .eg-roll-in .eg-roll-5 {
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.eg-roll-in .eg-roll-2 { background-image: linear-gradient(92deg, #2a1640, #8a3fd1 70%, #d24bb0); }
.eg-roll-in .eg-roll-3 { background-image: linear-gradient(92deg, #3a1a14, #e0601c 60%, #ff3d7a); }
.eg-roll-in .eg-roll-4 { background-image: linear-gradient(92deg, #b0151a, #ff4a1c 55%, #ff9a1c); letter-spacing: -.02em; }
.eg-roll-in .eg-roll-5 {
  background-image: linear-gradient(92deg, #c27a00, #ffb81c 35%, #ff6f91 70%, #c27a00);
  background-size: 200% 100%; font-weight: 800; letter-spacing: -.035em;
  animation: eg-sheen 3s linear infinite;
}
@keyframes eg-sheen { to { background-position: -200% 0; } }

.eg-hint {
  margin: 4px 0 0; min-height: 20px;
  font-size: 14px; line-height: 20px; color: rgb(var(--eg-hint));
  animation: eg-in .5s var(--ease-out) both;
}
.eg-root.is-brainless .eg-hint { color: var(--ink2); }
.eg-lv-0 .eg-hint { font-style: italic; }
.eg-lv-4 .eg-hint, .eg-lv-5 .eg-hint { font-weight: 600; }
@keyframes eg-in { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } }

.eg-reset {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 12px 0 10px; margin-top: 2px; border: 0; border-radius: 99px; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--ink);
  background: rgba(255, 255, 255, .6);
  box-shadow: 0 0 0 .5px rgba(30, 20, 50, .08), 0 1px 2px rgba(30, 20, 50, .08), inset 0 1px 0 #fff;
  opacity: 0; transform: scale(.88); pointer-events: none;
  transition: opacity .3s var(--ease-out), transform .45s var(--ease-out), background .2s;
}
.eg-reset.on { opacity: 1; transform: none; pointer-events: auto; }
.eg-reset:hover { background: rgba(255, 255, 255, .85); }
.eg-reset:active { transform: scale(.94); }
.eg-reset svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.eg-reset:focus-visible { outline: 2px solid rgba(70, 110, 255, .6); outline-offset: 2px; }

/* ---------- track ---------- */
.eg-track {
  position: relative; height: 68px; margin-top: 18px;
  touch-action: pan-y; cursor: grab; outline: none;
  -webkit-user-select: none; user-select: none;
}
.eg-track:active { cursor: grabbing; }
.eg-well {
  position: absolute; inset: 0; border-radius: 34px; overflow: hidden; isolation: isolate;
  background: linear-gradient(180deg, rgba(110, 96, 140, .14), rgba(110, 96, 140, .07));
  box-shadow: inset 0 1px 3px rgba(40, 24, 70, .14), inset 0 0 0 .5px rgba(60, 40, 90, .08);
  transition: box-shadow .2s;
}
.eg-track:focus-visible .eg-well {
  box-shadow: inset 0 1px 3px rgba(40, 24, 70, .14), 0 0 0 3px rgba(70, 110, 255, .45);
}
.eg-heat, .eg-aura, .eg-night { position: absolute; inset: 0; pointer-events: none; }
/* Low: the track becomes a night sky (crescent moon, a few faint stars), weighted by the Low look */
.eg-night {
  opacity: var(--eg-l0);
  background:
    radial-gradient(90% 150% at 82% 0%, rgba(88, 112, 196, .55), rgba(88, 112, 196, 0) 65%),
    linear-gradient(180deg, #1b2556, #2a3a78);
}
.eg-night svg { position: absolute; right: 18px; top: 0; width: 140px; height: 68px; }
.eg-star { animation: eg-star 3.2s ease-in-out infinite; }
@keyframes eg-star { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
.eg-heat { background: radial-gradient(70% 140% at 85% 50%, rgba(255, 90, 50, .28), rgba(255, 90, 50, 0) 70%); opacity: var(--eg-hot); }
.eg-aura {
  background:
    radial-gradient(60% 160% at 92% 50%, rgba(255, 200, 70, .55), rgba(255, 200, 70, 0) 70%),
    linear-gradient(90deg, rgba(255, 244, 205, .5), rgba(255, 214, 120, .4) 60%, rgba(255, 190, 80, .45));
  opacity: var(--eg-bb);
}
.eg-dot {
  position: absolute; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
  background: rgba(50, 36, 80, .22);
}
.eg-dot.rec { width: 6px; height: 6px; margin: -3px 0 0 -3px; background: transparent; box-shadow: inset 0 0 0 1.5px rgba(70, 100, 230, .5); }
/* detent dots turn into faint stars on the night sky */
.eg-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(214, 224, 255, .5); opacity: var(--eg-l0); }
.eg-dot.rec::after { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(190, 206, 255, .75); }

/* fill: one layer per level look, cross-faded by the level weights (they always sum to 1) */
.eg-fill {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 34px; overflow: hidden;
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .9), 0 0 6px rgba(40, 24, 70, .06);
  will-change: transform;
  /* at Low nothing is filled yet: the empty fill's round cap all but disappears into the night sky */
  opacity: calc(1 - var(--eg-l0));
}
.eg-fill::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .58));
  opacity: calc(1 - var(--eg-l0) * .82);
}
.eg-f { position: absolute; inset: 0; border-radius: inherit; }
/* Low: moonlit night-blue glass */
.eg-f0 { background: linear-gradient(90deg, rgba(120, 140, 220, 0) 20%, rgba(150, 170, 240, .38)); opacity: var(--eg-l0); }
/* Medium: soft pink */
.eg-f1 { background: linear-gradient(90deg, rgba(255, 196, 222, 0) 25%, rgba(255, 150, 196, .5)); opacity: var(--eg-l1); }
/* High: violet-magenta with a faint neuron dot grid */
.eg-f2 {
  background:
    radial-gradient(circle, rgba(170, 80, 230, .35) 1px, transparent 1.6px) 0 0 / 12px 12px,
    linear-gradient(90deg, rgba(220, 160, 255, 0) 20%, rgba(200, 110, 240, .42) 70%, rgba(255, 110, 200, .55));
  opacity: var(--eg-l2);
}
/* Extra: warm coral with moving electric stripes */
.eg-f3 {
  background:
    repeating-linear-gradient(115deg, rgba(255, 255, 255, 0) 0 10px, rgba(255, 236, 160, .42) 10px 14px),
    linear-gradient(90deg, rgba(255, 190, 120, 0) 15%, rgba(255, 150, 70, .5) 65%, rgba(255, 90, 110, .6));
  background-size: 30px 100%, 100% 100%;
  animation: eg-stripes .6s linear infinite;
  opacity: var(--eg-l3);
}
@keyframes eg-stripes { to { background-position: 30px 0, 0 0; } }
/* Max: red-hot with a heat shimmer */
.eg-f4 {
  background:
    linear-gradient(90deg, transparent 0 30%, rgba(255, 230, 160, .45) 45%, transparent 60%) 0 0 / 220% 100%,
    linear-gradient(90deg, rgba(255, 140, 60, 0) 10%, rgba(255, 90, 40, .6) 60%, rgba(220, 20, 40, .75));
  animation: eg-shimmer 1.1s ease-in-out infinite;
  opacity: var(--eg-l4);
}
@keyframes eg-shimmer { from { background-position: 120% 0, 0 0; } to { background-position: -120% 0, 0 0; } }
/* Big Brain: polished gold with a bright sheen sweeping across it */
.eg-f5 {
  background:
    linear-gradient(105deg, transparent 0 38%, rgba(255, 255, 240, .25) 44%, rgba(255, 255, 255, .95) 49%, rgba(255, 255, 240, .25) 54%, transparent 60%) 0 0 / 250% 100%,
    linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 45%, rgba(190, 110, 0, .14)),
    linear-gradient(90deg, rgba(255, 236, 170, .55), rgba(255, 214, 92, .85) 45%, #ffc23a 78%, #f5a614);
  animation: eg-shimmer 2.4s ease-in-out infinite;
  opacity: var(--eg-l5);
}

/* ---------- zombie ---------- */
.eg-zlayer { position: absolute; inset: 0; border-radius: 34px; overflow: hidden; pointer-events: none; z-index: 2; }
.eg-root.is-eating:not([data-nap="pop"]):not([data-nap="startle"]) .eg-zlayer { z-index: 4; }
.eg-zombie {
  position: absolute; left: 0; top: 1px; width: 100%; height: 74px;
  transform-origin: 37px 44px; will-change: transform;
  transition: opacity .3s;
}
.eg-root:not(.is-ready) .eg-zombie { opacity: 0; }
.eg-zombie-svg { display: block; overflow: visible; }
.eg-z-run, .eg-z-tip, .eg-z-shiver, .eg-z-bob { width: 74px; height: 74px; transform-origin: 37px 42px; }
.eg-z-bob { animation: eg-bob 1.9s ease-in-out infinite alternate; transform-origin: 37px 66px; }
@keyframes eg-bob { from { transform: translateY(.4px) rotate(-2deg); } to { transform: translateY(-1.6px) rotate(2deg); } }
.eg-z-shiver { animation: eg-shiver .085s linear infinite alternate; }
@keyframes eg-shiver {
  from { transform: translateX(calc(var(--eg-sweat) * -1.1px)); }
  to { transform: translateX(calc(var(--eg-sweat) * 1.1px)); }
}
/* sneaking: tiptoe steps */
.eg-z-tip { animation: eg-tip .34s ease-in-out infinite alternate; transform-origin: 37px 66px; }
@keyframes eg-tip {
  from { transform: translateY(0) rotate(0deg); }
  to { transform: translateY(calc(var(--eg-sneak) * -2.4px)) rotate(calc(var(--eg-sneak) * -3deg)); }
}
/* fleeing: frantic run cycle */
.eg-z-run { animation: eg-run .16s linear infinite alternate; transform-origin: 37px 66px; }
@keyframes eg-run {
  from { transform: translateY(calc(var(--eg-scream) * -3.2px)) rotate(calc(var(--eg-scream) * -7deg)); }
  to { transform: translateY(calc(var(--eg-scream) * .6px)) rotate(calc(var(--eg-scream) * 5deg)); }
}
.eg-z-pupil {
  transform-box: fill-box; transform-origin: center;
  transform: scale(calc(1 - var(--eg-fear) * .45));
}
.eg-z-look { transform: translateX(calc(var(--eg-sneak) * -.7px)); }
.eg-z-mouth { opacity: calc(1 - var(--eg-scream)); transform-box: fill-box; transform-origin: 50% 0; }
.eg-z-scream { opacity: var(--eg-scream); transform-box: fill-box; transform-origin: 50% 0; animation: eg-yell .22s ease-in-out infinite alternate; }
@keyframes eg-yell { to { transform: scaleY(.88); } }
.eg-z-arms, .eg-z-aaa { opacity: var(--eg-scream); }
.eg-z-aaa { transform-box: fill-box; transform-origin: 80% 100%; animation: eg-wig .2s steps(2) infinite; }
@keyframes eg-wig { 50% { transform: rotate(-4deg) translateY(-.4px); } }
.eg-z-speed { opacity: var(--eg-flee); }
.eg-z-lids { opacity: var(--eg-sneak); }
.eg-z-bang { opacity: var(--eg-scare); }
.eg-z-sweat { opacity: var(--eg-sweat); transform-box: fill-box; transform-origin: 50% 0; animation: eg-drip 1.4s ease-in infinite; }
.eg-z-sweat2 { opacity: max(var(--eg-scare), var(--eg-scream)); }
@keyframes eg-drip { 0%, 40% { transform: translateY(0); } 100% { transform: translateY(1.2px) scaleY(1.06); } }
.eg-z-smear { opacity: 0; transition: opacity .3s .2s; }
.eg-root.is-brainless .eg-z-smear { opacity: 1; }
.eg-root.is-eating .eg-z-mouth { animation: eg-chomp .22s ease-in-out 4; }
@keyframes eg-chomp { 50% { transform: scaleY(.38); } }
.eg-root.is-brainless:not(.is-eating) .eg-z-mouth { animation: none; }
/* after the bite: two big chews (jaw + head bob), then a little burp, then idle */
.eg-zombie-svg { transform-origin: 50% 70%; }
.eg-root[data-munch="chew"] .eg-z-mouth { animation: eg-chomp .32s ease-in-out 2; }
.eg-root[data-munch="chew"] .eg-zombie-svg { animation: eg-chew .32s ease-in-out 2; }
@keyframes eg-chew { 50% { transform: translateY(1.6px) rotate(3deg) scaleY(.97); } }
.eg-root[data-munch="burp"] .eg-zombie-svg { animation: eg-burpbob .5s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes eg-burpbob { 30% { transform: translateY(-1.2px) rotate(-5deg) scale(1.03); } }
.eg-z-burp { opacity: 0; visibility: hidden; }
.eg-root[data-munch="burp"] .eg-z-burp { opacity: 1; visibility: visible; }
.eg-z-bp { transform-box: fill-box; transform-origin: center; }
.eg-root[data-munch="burp"] .eg-z-bp { animation: eg-bpuff .9s ease-out both; }
@keyframes eg-bpuff { from { transform: scale(.2); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 70% { opacity: .9; } to { transform: translate(-1px, -2px) scale(.8); opacity: 0; } }
.eg-z-bcloud { transform-box: fill-box; transform-origin: 80% 100%; }
.eg-root[data-munch="burp"] .eg-z-bcloud { animation: eg-bcloud .97s cubic-bezier(.2, .8, .3, 1) .08s both; }
@keyframes eg-bcloud {
  from { transform: translate(3px, 6px) scale(.25); opacity: 0; }
  22% { transform: translate(0, 0) scale(1.08); opacity: 1; }
  34% { transform: scale(1); }
  78% { transform: translate(0, -1px); opacity: 1; }
  to { transform: translate(-.5px, -3px) scale(1.04); opacity: 0; }
}

/* ---------- knob ---------- */
.eg-thumb { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; will-change: transform; }
.eg-knob { position: absolute; left: -28px; top: 6px; width: 56px; height: 56px; will-change: transform; }
.eg-shake, .eg-float { position: absolute; inset: 0; }
/* Max: overclocked shake */
.eg-shake { animation: eg-shake .09s linear infinite alternate; }
@keyframes eg-shake {
  from { transform: translate(calc(var(--eg-hot) * -.9px), calc(var(--eg-hot) * .4px)); }
  to { transform: translate(calc(var(--eg-hot) * .9px), calc(var(--eg-hot) * -.4px)); }
}
/* Disc + brain sit in one wrapper that grows at Big Brain (×1.14: a 64px disc, still inside the 68px track) */
.eg-bbs { position: absolute; inset: 0; transform: scale(calc(1 + var(--eg-bb) * .14)); }
/* porcelain disc (SVG, 80px box centred on the 56px knob; the disc itself is r = 28px) */
.eg-disc { position: absolute; inset: -12px; pointer-events: none; }
.eg-disc-svg { display: block; width: 100%; height: 100%; overflow: visible; }
/* per-level accent ring, concentric with the disc: night blue at Low … gold at Big Brain */
.eg-disc-acc { stroke: rgb(var(--eg-accent)); opacity: calc(.45 + var(--eg-acc) * .35 - var(--eg-bb) * .8); }
.eg-disc-gold { opacity: var(--eg-bb); }
/* keyboard focus: a ring around the brain (the well's ring shows too) */
.eg-knob::after {
  content: ""; position: absolute; inset: calc(-2px - var(--eg-bb) * 4px); border-radius: 50%; pointer-events: none;
  box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .8), 0 0 0 3.5px rgba(70, 110, 255, .65);
  opacity: 0; transition: opacity .15s;
}
.eg-track:focus-visible .eg-knob::after { opacity: 1; }
.eg-glow {
  position: absolute; inset: calc(-9px - var(--eg-bb) * 3px); border-radius: 50%;
  /* a soft round glow centred behind the brain: no hard edge, so it never reads as a disc */
  background: radial-gradient(closest-side, rgba(var(--eg-accent), .5), rgba(var(--eg-accent), .26) 50%, rgba(var(--eg-accent), .08) 78%, rgba(var(--eg-accent), 0));
  opacity: max(var(--eg-glow), var(--eg-bb));
  animation: eg-pulse 1.5s ease-in-out infinite;
}
@keyframes eg-pulse { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.08); } }
/* Big Brain: disc and brain float together */
.eg-bbs { animation: eg-float2 1.6s ease-in-out infinite alternate; }
@keyframes eg-float2 {
  from { transform: translateY(calc(var(--eg-bb) * .5px)) scale(calc(1 + var(--eg-bb) * .14)); }
  to { transform: translateY(calc(var(--eg-bb) * -1px)) scale(calc(1 + var(--eg-bb) * .14)); }
}
@keyframes eg-float { from { transform: translateY(calc(var(--eg-bb) * .5px)); } to { transform: translateY(calc(var(--eg-bb) * -1px)); } }
/* the brain: a 44px box centred on the disc, so its lobes keep ~6px clear of the rim at every level.
   Keep in sync with BRAIN_BOX / discPose() in the component (the disc's bite follows this pose).
   A soft shadow grounds it on the porcelain; at Big Brain a golden rim-light hugs its outline. */
.eg-brain {
  position: absolute; inset: 6px;
  transform: translateY(calc(var(--eg-sleep) * 1px)) rotate(calc(var(--eg-sleep) * -13deg));
  filter:
    brightness(calc(1 + var(--eg-spark) * .06))
    drop-shadow(0 0 calc(var(--eg-bb) * 1.6px) rgba(255, 190, 40, calc(var(--eg-bb) * .85)))
    drop-shadow(0 .8px 1px rgba(40, 18, 60, calc(.2 - var(--eg-bb) * .08)));
}
/* breathing per look: slow (Low), gentle (Medium/High), fast (Extra/Max); amplitudes are level weights */
.eg-br0, .eg-br1, .eg-br3 { width: 100%; height: 100%; }
.eg-br0 { animation: eg-br0 4.6s ease-in-out infinite; }
.eg-br1 { animation: eg-br1 3s ease-in-out infinite; }
.eg-br3 { animation: eg-br3 .7s ease-in-out infinite; }
@keyframes eg-br0 { 50% { transform: scale(calc(1 + var(--eg-l0) * .045)) translateY(calc(var(--eg-l0) * .6px)); } }
@keyframes eg-br1 { 50% { transform: scale(calc(1 + (var(--eg-l1) + var(--eg-l2)) * .035)); } }
@keyframes eg-br3 { 50% { transform: scale(calc(1 + (var(--eg-l3) + var(--eg-l4)) * .05)); } }
.eg-root.is-brainless .eg-br0, .eg-root.is-brainless .eg-br1, .eg-root.is-brainless .eg-br3 { animation: none; }
.eg-brain-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.eg-b-awake { opacity: var(--eg-awake); }
.eg-b-hot { opacity: var(--eg-hot); }
.eg-b-gold, .eg-b-rim, .eg-b-shine { opacity: var(--eg-bb); }
/* Big Brain: a shine sweeps across the gold */
.eg-b-sweep { transform: translateX(-420px) skewX(-20deg); animation: eg-bsweep 2.6s cubic-bezier(.45, 0, .3, 1) infinite; }
@keyframes eg-bsweep { 0% { transform: translateX(-420px) skewX(-20deg); } 55%, 100% { transform: translateX(640px) skewX(-20deg); } }
/* bitten: dazed spiral eyes + dizzy stars on the half brain that is left */
.eg-b-daze, .eg-b-dizzy { opacity: min(1, calc(var(--eg-bite) * 1.6)); }
.eg-b-spin { animation: eg-spin 1.6s linear infinite; }
.eg-b-spin2 { animation-direction: reverse; }
@keyframes eg-spin { to { transform: rotate(360deg); } }
.eg-b-orbit { animation: eg-orbit 1.2s linear infinite; }
@keyframes eg-orbit {
  0% { transform: translate(80px, 0) scale(1); }
  12.5% { transform: translate(57px, 21px) scale(1.12); }
  25% { transform: translate(0, 30px) scale(1.2); }
  37.5% { transform: translate(-57px, 21px) scale(1.12); }
  50% { transform: translate(-80px, 0) scale(1); }
  62.5% { transform: translate(-57px, -21px) scale(.86); }
  75% { transform: translate(0, -30px) scale(.78); }
  87.5% { transform: translate(57px, -21px) scale(.86); }
  100% { transform: translate(80px, 0) scale(1); }
}
/* ---------- Low: sound asleep ---------- */
/* nightcap: fades and lifts off as the brain wakes; knocked askew by the startle and while brainless */
.eg-root[data-nap="startle"], .eg-root[data-nap="bite"] { --eg-capk: 1; }
.eg-cap-o { opacity: var(--eg-sleep); transform: translateY(calc((1 - var(--eg-sleep)) * -130px)); }
.eg-cap {
  transform: translate(calc(var(--eg-capk) * -60px), calc(var(--eg-capk) * -70px)) rotate(calc(var(--eg-capk) * -24deg));
  transition: transform .3s cubic-bezier(.3, 1.7, .5, 1);
}
/* the bite knocks the cap clean off: it flies up and away from the zombie, spinning, and fades */
.eg-root.is-brainless .eg-cap {
  transform: translate(-210px, -550px) rotate(-120deg); opacity: 0; transition: none;
  animation: eg-capfly .62s cubic-bezier(.2, .75, .4, 1) both;
}
@keyframes eg-capfly {
  from { transform: translate(-60px, -70px) rotate(-24deg); opacity: 1; }
  55% { opacity: 1; }
  to { transform: translate(-210px, -550px) rotate(-120deg); opacity: 0; }
}
/* snot bubble: size from --eg-bub (zombie distance), inflates/deflates with the slow Low breath (same 4.6s loop as .eg-br0) */
.eg-bub { transform: scale(var(--eg-bub)); }
.eg-bub-br { animation: eg-bubbr 4.6s ease-in-out infinite; }
@keyframes eg-bubbr { 0%, 100% { transform: scale(.72); } 50% { transform: scale(1.06); } }
.eg-root[data-nap] .eg-bub, .eg-root.is-brainless .eg-bub { visibility: hidden; }
/* pop burst */
.eg-pop { opacity: 0; }
.eg-root[data-nap] .eg-pop { opacity: 1; }
.eg-pop-ring { transform: scale(calc(var(--eg-popk) * .6)); animation: eg-popring .32s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes eg-popring { to { transform: scale(calc(var(--eg-popk) * 1.5)); opacity: 0; } }
.eg-pop-spikes { animation: eg-popspike .3s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes eg-popspike { from { transform: scale(calc(var(--eg-popk) * .5)); } 40% { opacity: 1; } to { transform: scale(calc(var(--eg-popk) * 1.25)); opacity: 0; } }
.eg-pop-drop { animation: eg-popdrop .5s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes eg-popdrop {
  from { transform: scale(calc(var(--eg-popk) * .7)); }
  70% { opacity: 1; }
  to { transform: translate(var(--dx), calc(var(--dy) + 90px)) scale(var(--eg-popk)); opacity: 0; }
}
/* startle: eyes snap open, the brain jolts, the "!" flashes, zzz stop */
.eg-b-eyes { opacity: 0; }
.eg-root[data-nap="startle"] .eg-b-eyes, .eg-root[data-nap="bite"] .eg-b-eyes { opacity: var(--eg-sleep); }
.eg-b-eye { transform-box: fill-box; transform-origin: center; }
.eg-root[data-nap="startle"] .eg-b-eye { animation: eg-eyepop .16s cubic-bezier(.3, 1.8, .5, 1) both; }
@keyframes eg-eyepop { from { transform: scale(.2, .1); } }
.eg-root[data-nap="startle"] .eg-float { animation: eg-jolt .15s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes eg-jolt { 0% { transform: none; } 45% { transform: translateY(-2.5px) rotate(9deg) scale(1.05); } 100% { transform: translateY(-1.5px) rotate(5deg) scale(1.02); } }
.eg-root[data-nap="startle"] .eg-fx-alert, .eg-root[data-nap="bite"] .eg-fx-alert { opacity: 1; transition: none; }
.eg-root[data-nap="startle"] .eg-fx-bang { animation: eg-pop .3s var(--ease-out) both; }
.eg-root[data-nap] .eg-zzz { visibility: hidden; }

/* easter egg: brain flashes when it catches the zombie */
.eg-root[data-egg="alert"] .eg-br3 { animation: eg-flash .38s var(--ease-out); }
@keyframes eg-flash { 30% { transform: scale(1.16); filter: brightness(1.25); } }

/* knob effects */
/* lives inside .eg-shake (56px box), so it follows the press scale and the Max shake; centred on the knob */
.eg-fx { position: absolute; left: -42px; top: -22px; width: 140px; height: 100px; overflow: visible; }
.eg-fx-spark { opacity: var(--eg-spark); }
.eg-fx-zap { opacity: var(--eg-zap); }
.eg-fx-hot { opacity: var(--eg-hot); }
.eg-fx-bb { opacity: var(--eg-bb); }
.eg-fx-alert { opacity: 0; transition: opacity .25s; }
.eg-root[data-egg="alert"] .eg-fx-alert, .eg-root[data-egg="scoot"] .eg-fx-alert { opacity: 1; transition: none; }
.eg-root[data-egg="alert"] .eg-fx-bang, .eg-root[data-egg="scoot"] .eg-fx-bang { animation: eg-pop .4s var(--ease-out) both; }
.eg-fx-bang { transform-box: fill-box; transform-origin: 30% 100%; }
@keyframes eg-pop { from { transform: scale(.2) rotate(-20deg); } 60% { transform: scale(1.15) rotate(6deg); } }
.eg-fx-tw { transform-box: fill-box; transform-origin: center; animation: eg-tw 1.3s ease-in-out infinite; }
@keyframes eg-tw { 0%, 100% { transform: scale(.5) rotate(0deg); opacity: .25; } 50% { transform: scale(1.1) rotate(25deg); opacity: 1; } }
.eg-fx-flick { animation: eg-flick .5s steps(1) infinite; }
@keyframes eg-flick { 0% { opacity: 1; } 18% { opacity: .15; } 34% { opacity: .9; } 52% { opacity: 0; } 70% { opacity: 1; } 86% { opacity: .3; } }
.eg-fx-puff { transform-box: fill-box; transform-origin: center; animation: eg-puff 1.35s ease-out infinite; }
@keyframes eg-puff { from { transform: translateY(6px) scale(.4); opacity: 0; } 25% { opacity: .95; } to { transform: translateY(-12px) scale(1.25); opacity: 0; } }
.eg-fx-wave { animation: eg-wave .5s ease-in-out infinite alternate; }
@keyframes eg-wave { to { transform: translateY(-2px); } }
.eg-fx-rays { animation: eg-rays 14s linear infinite; }
@keyframes eg-rays { to { transform: rotate(360deg); } }
.eg-fx-gl { animation-name: eg-twg; }
@keyframes eg-twg { 0%, 100% { transform: scale(.35) rotate(0deg); opacity: .2; } 45% { transform: scale(1.15) rotate(30deg); opacity: 1; } 60% { transform: scale(1) rotate(40deg); opacity: .95; } }
.eg-fx-halo { animation: eg-float 1.6s ease-in-out infinite alternate; }

.eg-root.is-brainless .eg-zzz { visibility: hidden; }
/* zzz rise from behind the knob's upper right and stay over the night sky */
.eg-zzz { position: absolute; left: 18px; top: 4px; width: 30px; height: 30px; opacity: var(--eg-sleep); }
.eg-zzz span {
  position: absolute; left: 0; bottom: 0;
  font: italic 700 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Inter", sans-serif;
  color: #e4e9ff; text-shadow: 0 1px 2px rgba(20, 28, 80, .55); opacity: 0;
  animation: eg-z 2.6s ease-out infinite;
}
.eg-zzz span:nth-child(2) { animation-delay: .87s; font-size: 10px; }
.eg-zzz span:nth-child(3) { animation-delay: 1.74s; font-size: 9px; }
@keyframes eg-z {
  0% { transform: translate(0, 6px) scale(.6) rotate(-8deg); opacity: 0; }
  20% { opacity: .9; }
  100% { transform: translate(14px, -15px) scale(1.15) rotate(8deg); opacity: 0; }
}

/* crumbs fly off the cut edge (down the middle of the brain) toward the zombie and fall: brain bits */
.eg-crumbs { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; pointer-events: none; }
.eg-crumbs i {
  position: absolute; left: 6px; top: var(--y, 34px); width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
  background: #f07aaa; box-shadow: inset 0 0 0 .8px rgba(90, 37, 70, .6);
  animation: eg-crumb .85s cubic-bezier(.2, .7, .3, 1) forwards;
}
.eg-crumbs i:nth-child(even) { background: #ffc2da; border-radius: 45% 55% 40% 60%; }
.eg-crumbs i:nth-child(3n) { background: #e45d97; }
.eg-crumbs i:nth-child(4n) { background: #fbf9fe; border-radius: 2px 40% 1px 50%; box-shadow: inset 0 0 0 .6px rgba(40, 24, 70, .3); }
.eg-crumbs i:nth-child(1) { --y: 12px; --dx: 20px; --dy: -14px; width: 6px; height: 5px; }
.eg-crumbs i:nth-child(2) { --y: 16px; --dx: 32px; --dy: -6px; width: 4px; height: 4px; --rot: 70deg; }
.eg-crumbs i:nth-child(3) { --y: 22px; --dx: 14px; --dy: -20px; width: 3.5px; height: 3.5px; }
.eg-crumbs i:nth-child(4) { --y: 26px; --dx: 38px; --dy: 2px; width: 6.5px; height: 5.5px; --rot: -50deg; }
.eg-crumbs i:nth-child(5) { --y: 30px; --dx: 24px; --dy: -10px; width: 3px; height: 3px; }
.eg-crumbs i:nth-child(6) { --y: 34px; --dx: 44px; --dy: 8px; width: 4.5px; height: 3.5px; --rot: 120deg; }
.eg-crumbs i:nth-child(7) { --y: 38px; --dx: 18px; --dy: 14px; width: 5.5px; height: 5px; }
.eg-crumbs i:nth-child(8) { --y: 42px; --dx: 34px; --dy: 16px; width: 3px; height: 2.5px; --rot: -90deg; }
.eg-crumbs i:nth-child(9) { --y: 46px; --dx: 26px; --dy: 4px; width: 4px; height: 4px; }
.eg-crumbs i:nth-child(10) { --y: 50px; --dx: 12px; --dy: 10px; width: 2.5px; height: 2.5px; --rot: 40deg; }
.eg-crumbs i:nth-child(11) { --y: 54px; --dx: 30px; --dy: 6px; width: 5px; height: 4px; --rot: 160deg; }
.eg-crumbs i:nth-child(12) { --y: 20px; --dx: 46px; --dy: -2px; width: 2.5px; height: 2.5px; }
@keyframes eg-crumb {
  0% { transform: translate(0, 0) scale(.4); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translate(var(--dx), calc(var(--dy) + 18px)) rotate(var(--rot, 0deg)) scale(1); opacity: 0; }
}

/* ---------- labels ---------- */
.eg-labels { position: relative; height: 24px; margin-top: 8px; }
.eg-label {
  position: absolute; top: 0; transform: translateX(-50%);
  padding: 3px 4px; border: 0; background: none; cursor: pointer; white-space: nowrap;
  font-size: 12px; font-weight: 600; letter-spacing: -.005em; color: var(--ink3);
  transition: color .3s var(--ease-out);
}
.eg-label:hover { color: var(--ink2); }
.eg-label.on { color: rgb(var(--eg-hint)); }
.eg-lv-1 .eg-label.on { color: var(--ink); }
.eg-label.rec::after {
  content: ""; position: absolute; left: 50%; bottom: -3px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%;
  background: rgba(70, 100, 230, .6);
}
.eg-root.is-top .eg-label:last-child.on {
  background: linear-gradient(92deg, #c27a00, #ff9f1c 50%, #ff5f8a);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.eg-foot {
  position: relative;
  margin: 12px 0 0; padding-top: 12px; border-top: .5px solid rgba(30, 20, 50, .09);
  font-size: 12px; line-height: 16px; color: var(--ink3);
}
.eg-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  .eg-root *, .eg-root *::before, .eg-root *::after { animation: none !important; transition: none !important; }
  .eg-zzz span:first-child { opacity: .8; transform: translate(12px, -12px); }
  .eg-fx-tw { opacity: .85; }
  .eg-pop { display: none; }
  .eg-crumbs { display: none; }
  .eg-b-orbit:nth-child(1) { transform: translate(-62px, -14px); }
  .eg-b-orbit:nth-child(2) { transform: translate(70px, -8px); }
  .eg-b-orbit:nth-child(3) { transform: translate(10px, 26px); }
}

/* ---------- the zombie's speech bubble (gibberish; shown even when muted) ---------- */
.eg-say {
  --eg-tail: 50%;
  position: absolute; left: 0; bottom: calc(100% - 3px); z-index: 6;
  pointer-events: none; white-space: nowrap; will-change: transform, opacity;
  opacity: 0; transition: opacity .22s ease-out;
}
.eg-say.on { opacity: 1; transition-duration: .12s; }
.eg-say-in {
  position: relative; display: block;
  padding: 4px 9px 5px; border-radius: 9px;
  font-size: 12px; line-height: 15px; font-weight: 800; letter-spacing: .01em; color: #2a3a1c;
  background: linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(246, 250, 238, .84));
  -webkit-backdrop-filter: blur(10px) saturate(1.6); backdrop-filter: blur(10px) saturate(1.6);
  border: 1.5px solid #2b2f3a;
  box-shadow: 2px 2px 0 rgba(43, 47, 58, .18), inset 0 1px 0 #fff;
  transform-origin: var(--eg-tail) 130%;
  visibility: hidden; /* until the first syllable is spoken */
}
.eg-say-in.live { visibility: visible; animation: eg-say-pop .42s cubic-bezier(.3, 1.7, .5, 1) both; }
.eg-say .eg-say-in.long { font-size: 10.5px; letter-spacing: 0; padding: 4px 8px 5px; }
/* typed along with the voice: each syllable appears at its onset in the audio (the full line reserves the width) */
.eg-syl { opacity: 0; display: inline-block; white-space: pre; }
.eg-syl.on { opacity: 1; animation: eg-syl-in .16s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes eg-syl-in { from { opacity: 0; transform: translateY(3px) scale(.7); } to { opacity: 1; transform: none; } }
/* Low: a soft, silent "zzz" drifts in after the last spoken syllable */
.eg-syl.eg-syl-z { font-size: .82em; font-weight: 700; letter-spacing: .06em; color: #8a94b8; }
.eg-syl.eg-syl-z.on { opacity: .85; animation: eg-syl-z-in .7s var(--ease-out, ease-out) both; }
@keyframes eg-syl-z-in { from { opacity: 0; transform: translate(-2px, 2px); } to { opacity: .85; transform: none; } }
/* pixel tail: two stacked squares under the bubble, pointing at the zombie's head */
.eg-say-in::before, .eg-say-in::after {
  content: ""; position: absolute; left: var(--eg-tail); background: inherit;
  border: 1.5px solid #2b2f3a; border-top: 0;
}
.eg-say-in::before { width: 9px; height: 5px; bottom: -5px; margin-left: -4.5px; border-radius: 0 0 2px 2px; background: #f6faee; box-shadow: 0 -1.5px 0 #f6faee; }
.eg-say-in::after { width: 5px; height: 4px; bottom: -8.5px; margin-left: -1px; border-radius: 0 0 1.5px 1.5px; background: #f6faee; }
@keyframes eg-say-pop {
  0% { transform: scale(.4) translateY(6px); opacity: 0; }
  60% { opacity: 1; }
  100% { transform: none; opacity: 1; }
}
/* per look */
.eg-say-0 .eg-say-in { font-style: italic; font-weight: 700; color: #4c5878; background: linear-gradient(180deg, rgba(240, 243, 255, .93), rgba(226, 232, 252, .86)); }
.eg-say-0 .eg-say-in.live { animation-duration: .6s; animation-timing-function: var(--ease-out); }
.eg-say-0 .eg-say-in::before, .eg-say-0 .eg-say-in::after { background: #e2e8fc; }
.eg-say-0 .eg-say-in::before { box-shadow: 0 -1.5px 0 #e2e8fc; }
.eg-say-1 .eg-say-in { color: #3d4a2a; }
.eg-say-3 .eg-say-in { font-size: 12.5px; color: #8a2a12; letter-spacing: .02em; }
.eg-say-4 .eg-say-in { color: #8f1f17; background: linear-gradient(180deg, rgba(255, 246, 236, .95), rgba(255, 228, 210, .88)); }
.eg-say-4 .eg-say-in.live { animation: eg-say-pop .32s cubic-bezier(.3, 1.7, .5, 1) both, eg-say-jit .09s steps(2) .32s infinite; }
.eg-say-4 .eg-say-in::before, .eg-say-4 .eg-say-in::after { background: #ffe4d2; }
.eg-say-4 .eg-say-in::before { box-shadow: 0 -1.5px 0 #ffe4d2; }
@keyframes eg-say-jit { 50% { transform: translate(.6px, -.5px) rotate(-.6deg); } }
.eg-say-5 .eg-say-in { font-size: 13px; letter-spacing: .03em; color: #e8337a; background: linear-gradient(180deg, rgba(255, 252, 236, .95), rgba(255, 240, 200, .88)); }
.eg-say-5 .eg-say-in.live { animation: eg-say-pop .3s cubic-bezier(.3, 1.7, .5, 1) both, eg-say-flee 2.1s cubic-bezier(.5, 0, .9, .6) .9s both; }
.eg-say-5 .eg-say-in::before, .eg-say-5 .eg-say-in::after { background: #fff0c8; }
.eg-say-5 .eg-say-in::before { box-shadow: 0 -1.5px 0 #fff0c8; }
/* Big Brain: the scream trails off to the right as he runs */
@keyframes eg-say-flee { to { transform: translateX(10px) scale(.9); opacity: .25; } }
.eg-say-eat .eg-say-in { color: #5f8a2c; font-style: italic; }
.eg-say-eat .eg-say-in.live { animation: eg-say-pop .36s cubic-bezier(.3, 1.7, .5, 1) both, eg-say-chew .32s ease-in-out .36s 2; }
@keyframes eg-say-chew { 50% { transform: translateY(1.5px) scaleY(.94); } }
@media (prefers-reduced-motion: reduce) {
  /* only a fade */
  .eg-root .eg-say { transition: opacity .25s ease-out !important; }
  .eg-root .eg-say-in, .eg-root .eg-syl { animation: none !important; transform: none !important; }
}
</style>
</head>
